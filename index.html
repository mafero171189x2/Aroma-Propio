<!doctype html>
<html lang="es" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aroma Propio</title>
<meta name="description" content="Perfumes con envío a todo el país. Elegí tu aroma y pagá por transferencia.">
<meta name="theme-color" content="#EEF7F6">
<script>
  /* Aplica el tema guardado antes de pintar, para evitar el parpadeo. */
  try {
    var t = JSON.parse(localStorage.getItem("ap_tema"));
    if (t === "noche") {
      document.documentElement.setAttribute("data-tema", "noche");
      document.querySelector('meta[name="theme-color"]').setAttribute("content", "#0A2429");
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --fondo:#EEF7F6; --superficie:#FFFFFF; --elevado:#E1F0EE; --borde:#CBE2DF;
  --tinta:#0E3B43; --tinta-2:#3D5F66; --suave:#5F7C82;
  --agua:#1AA6A1; --agua-osc:#0F7E7A; --agua-claro:#D2EEEB;
  --coral:#E8543F; --sol:#F5B942;
  --btn-fondo:#0F7E7A; --btn-texto:#FFFFFF; --precio:#0F7E7A;
  --header:rgba(238,247,246,.9); --velo:rgba(14,59,67,.45);
}
html[data-tema="noche"]{
  color-scheme:dark;
  --fondo:#0A2429; --superficie:#0F3037; --elevado:#153D45; --borde:#245560;
  --tinta:#E6F6F4; --tinta-2:#B5D3D0; --suave:#8DB0B2;
  --agua:#3FD0C9; --agua-osc:#3FD0C9; --agua-claro:#123F45;
  --coral:#FF7A66;
  --btn-fondo:#3FD0C9; --btn-texto:#062126; --precio:#5FE0D9;
  --header:rgba(10,36,41,.9); --velo:rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5;-webkit-font-smoothing:antialiased}
body.bloq{overflow:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0}
h2{font-size:1.5rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--agua);outline-offset:2px}
[hidden]{display:none!important}
.cont{width:100%;max-width:1180px;margin:0 auto;padding:0 1rem}
.flex1{flex:1}
.suave{color:var(--suave)}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Botones y campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.7rem 1.2rem;border-radius:999px;border:1.5px solid var(--btn-fondo);background:var(--btn-fondo);color:var(--btn-texto);font-weight:700;cursor:pointer;text-decoration:none;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;color:var(--tinta);border-color:var(--borde)}
.btn.sec:hover{border-color:var(--agua)}
.btn.peligro{background:transparent;color:var(--coral);border-color:var(--coral)}
.btn.chico{padding:.45rem .85rem;font-size:.85rem}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.campo{display:grid;gap:.3rem;margin-bottom:.8rem}
.campo>label,.lbl{font-size:.85rem;font-weight:600;color:var(--tinta-2)}
.inp{width:100%;padding:.65rem .8rem;border:1.5px solid var(--borde);border-radius:10px;background:var(--superficie);min-height:44px}
.inp:focus{border-color:var(--agua);outline:none;box-shadow:0 0 0 3px var(--agua-claro)}
textarea.inp{resize:vertical}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.chk{display:flex;gap:.6rem;align-items:flex-start;margin:.2rem 0 .8rem;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:.15rem;accent-color:var(--agua-osc);flex:none}
.ayuda{font-size:.8rem;color:var(--suave)}

/* Encabezado */
.hdr{position:sticky;top:0;z-index:50;background:var(--header);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--borde);padding-top:env(safe-area-inset-top,0)}
.hdr-in{display:flex;align-items:center;gap:.2rem;height:58px}
.logo{font-family:'Fraunces',Georgia,serif;font-size:1.4rem;font-weight:700;text-decoration:none;letter-spacing:-.01em;margin-left:.2rem}
.ib{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--tinta);text-decoration:none}
.ib:hover{background:var(--elevado)}
.ib.chico{width:34px;height:34px}
.bdg{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--coral);color:#fff;font-size:.7rem;font-weight:800;display:grid;place-items:center}
body.en-admin .hdr,body.en-admin .foot{display:none}
.dot{position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--agua);border:2px solid var(--fondo)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;background:var(--elevado);padding:.3rem;border-radius:999px;margin:.9rem 0 1.1rem}
.auth-tabs button{border:0;background:transparent;padding:.6rem;border-radius:999px;font-weight:700;cursor:pointer;color:var(--tinta-2);min-height:44px}
.auth-tabs button.on{background:var(--btn-fondo);color:var(--btn-texto)}

/* Portada */
#carga{position:fixed;inset:0;z-index:999;background:var(--fondo);display:grid;place-items:center;transition:opacity .5s,visibility 0s linear .5s}
#carga.fuera{opacity:0;visibility:hidden;pointer-events:none}
.pl{display:grid;justify-items:center;gap:.9rem;text-align:center;padding:1rem}
.pl-svg{width:140px;height:auto;overflow:visible}
.pl .nombre{font-family:'Fraunces',Georgia,serif;font-size:1.9rem;font-weight:700;line-height:1.1}
.pl-txt{font-weight:600;color:var(--tinta-2);letter-spacing:.02em}
.pl-pts i{display:inline-block;width:5px;height:5px;margin-left:4px;border-radius:50%;background:var(--agua);animation:pl-pt 1.2s ease-in-out infinite}
.pl-pts i:nth-child(2){animation-delay:.2s}
.pl-pts i:nth-child(3){animation-delay:.4s}
.pl-liq{animation:pl-llenar 2.6s ease-in-out infinite alternate}
.pl-ola{animation:pl-ondas 1.1s linear infinite}
.pl-m{transform-box:fill-box;transform-origin:center;opacity:0;animation:pl-rocio 1.8s ease-out infinite}
.pl-m2{animation-delay:.3s}
.pl-m3{animation-delay:.6s}
.pl-m4{animation-delay:.9s}
@keyframes pl-llenar{from{transform:translateY(96px)}to{transform:translateY(0)}}
@keyframes pl-ondas{to{transform:translateX(-40px)}}
@keyframes pl-rocio{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.85}100%{opacity:0;transform:translate(34px,-14px) scale(2.4)}}
@keyframes pl-pt{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* Hero */
.hero{display:grid;gap:1rem;align-items:center;padding:1.7rem 1.3rem;margin:1rem 0 1.4rem;background:var(--agua-claro);border-radius:24px;overflow:hidden;position:relative}
.hero h1{font-size:clamp(2rem,7vw,3.4rem)}
.hero p{color:var(--tinta-2);max-width:36ch;margin:.7rem 0 1.2rem;font-size:1.05rem}
.hero-arte{width:min(210px,52vw);justify-self:center;height:auto}
.ola{animation:ola 5s linear infinite}
.ola2{animation-duration:7.5s;animation-direction:reverse}
@keyframes ola{to{transform:translateX(-90px)}}
.hero.foto{background-size:cover;background-position:center;min-height:280px;color:#fff;align-content:end}
.hero.foto::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,33,38,.75),rgba(6,33,38,.15))}
.hero.foto>*{position:relative}
.hero.foto p{color:#eafaf8}
@media(min-width:720px){.hero{grid-template-columns:1.3fr .7fr;padding:2.8rem}}

/* Filtros */
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 .7rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:.45rem .95rem;border-radius:999px;border:1.5px solid var(--borde);background:var(--superficie);white-space:nowrap;cursor:pointer;font-weight:600;color:var(--tinta-2)}
.chip.on{background:var(--btn-fondo);border-color:var(--btn-fondo);color:var(--btn-texto)}
.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.7rem}
.busca{flex:1 1 200px;display:flex;align-items:center;gap:.5rem;padding:0 .8rem;border:1.5px solid var(--borde);border-radius:999px;background:var(--superficie);min-height:44px}
.busca input{flex:1;border:0;background:transparent;outline:none;min-width:0;padding:.5rem 0}
.busca:focus-within{border-color:var(--agua);box-shadow:0 0 0 3px var(--agua-claro)}
.toolbar select{width:auto;border-radius:999px}
.vtog{display:flex;border:1.5px solid var(--borde);border-radius:999px;overflow:hidden;background:var(--superficie)}
.vtog button{border:0;background:transparent;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--suave)}
.vtog button.on{background:var(--btn-fondo);color:var(--btn-texto)}

/* Grilla y tarjetas */
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.grid[data-vista="detalle"]{grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid[data-vista="detalle"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid[data-vista="detalle"]{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--superficie);border:1px solid var(--borde);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.pc-img{aspect-ratio:1/1;background:var(--elevado);display:grid;place-items:center;cursor:pointer}
.pc-img img{width:100%;height:100%;object-fit:contain;padding:.5rem}
.grid[data-vista="detalle"] .pc-img{aspect-ratio:4/3}
.pc-body{padding:.8rem;display:flex;flex-direction:column;flex:1;gap:.15rem}
.pc-marca{font-size:.78rem;color:var(--suave);min-height:1.15rem}
.pc-nombre{font-size:1rem;line-height:1.25;min-height:2.5rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-nombre a{text-decoration:none}
.pc-pres{font-size:.8rem;color:var(--tinta-2);min-height:1.2rem}
.pc-precios{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap;margin-top:.2rem}
.precio{font-weight:800;color:var(--precio);font-size:1.2rem;font-variant-numeric:tabular-nums}
.precio-old{text-decoration:line-through;color:var(--suave);font-size:.82rem}
.transf{font-size:.74rem;color:var(--agua-osc);font-weight:600}
.pc-btns{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.6rem}
.pc-btns .btn{padding:.5rem .3rem;font-size:.82rem}
.tag{position:absolute;top:.6rem;left:.6rem;z-index:2;font-size:.75rem;font-weight:800;padding:.15rem .55rem;border-radius:999px}
.tag-of{background:var(--coral);color:#fff}
.tag-sin{background:var(--tinta);color:var(--fondo)}
.fav{position:absolute;top:.5rem;right:.5rem;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--superficie);color:var(--tinta);display:grid;place-items:center;cursor:pointer;box-shadow:0 1px 4px rgba(14,59,67,.18)}
.fav.on{color:var(--coral)}
.fav.on .ico{fill:currentColor}

/* Producto */
.atras{display:inline-flex;align-items:center;gap:.3rem;margin:1rem 0;text-decoration:none;color:var(--tinta-2);font-weight:600}
.pdp{display:grid;gap:1.3rem;margin-bottom:2rem}
@media(min-width:800px){.pdp{grid-template-columns:1fr 1fr;gap:2.4rem}}
.gal-main{aspect-ratio:1/1;background:var(--elevado);border-radius:20px;display:grid;place-items:center;overflow:hidden}
.gal-main img{width:100%;height:100%;object-fit:contain;padding:1rem}
.gal-th{display:flex;gap:.5rem;margin-top:.6rem;overflow-x:auto}
.gal-th button{width:64px;height:64px;flex:none;border-radius:12px;border:2px solid var(--borde);background:var(--elevado);padding:2px;cursor:pointer;overflow:hidden}
.gal-th button.on{border-color:var(--agua)}
.gal-th img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.pdp h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:.2rem 0 .6rem}
.pdp .precio{font-size:1.9rem}
.notas{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0}
.nota{padding:.25rem .75rem;border-radius:999px;background:var(--agua-claro);color:var(--tinta);font-size:.85rem;font-weight:600}
.desc{color:var(--tinta-2);white-space:pre-line;margin:.8rem 0}
.aviso-stock{font-weight:700;color:var(--coral);margin:.4rem 0}
.compra{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--borde);border-radius:999px;background:var(--superficie)}
.qty button{width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.qty span{min-width:28px;text-align:center;font-weight:700}
.seccion{margin:2rem 0 1rem}

/* Paneles laterales */
.velo{position:fixed;inset:0;background:var(--velo);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s}
.velo.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;width:min(430px,100%);background:var(--superficie);z-index:120;display:flex;flex-direction:column;visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;padding-top:env(safe-area-inset-top,0)}
.drawer.der{right:0;transform:translateX(100%)}
.drawer.izq{left:0;transform:translateX(-100%)}
.drawer.abierto{transform:none;visibility:visible;transition:transform .25s ease}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;border-bottom:1px solid var(--borde)}
.dr-head h2{font-size:1.25rem}
.dr-body{flex:1;overflow-y:auto;padding:1rem}
.dr-foot{padding:1rem;border-top:1px solid var(--borde);padding-bottom:calc(1rem + env(safe-area-inset-bottom,0))}
.menu-l{display:grid;gap:.1rem}
.menu-l a,.menu-l button{display:flex;align-items:center;gap:.7rem;padding:.75rem .6rem;border-radius:12px;text-decoration:none;border:0;background:transparent;cursor:pointer;text-align:left;width:100%;font-weight:600}
.menu-l a:hover,.menu-l button:hover{background:var(--elevado)}
.menu-sep{font-size:.85rem;color:var(--suave);font-weight:700;margin:1rem .6rem .3rem}
.lin{display:grid;grid-template-columns:64px 1fr auto auto;gap:.7rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--borde)}
.lin-img{width:64px;height:64px;border-radius:12px;background:var(--elevado);overflow:hidden}
.lin-img img{width:100%;height:100%;object-fit:contain}
.lin-inf{display:grid;min-width:0}
.lin-inf strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila-t{display:flex;justify-content:space-between;gap:1rem;margin:.25rem 0}
.fila-t.total{font-size:1.2rem;font-weight:800;margin-top:.5rem}
.barra{height:8px;border-radius:4px;background:var(--elevado);overflow:hidden;margin:.4rem 0 .8rem}
.barra i{display:block;height:100%;background:var(--agua);border-radius:4px}
.vacio{display:grid;justify-items:center;gap:.8rem;text-align:center;padding:3rem 1rem;color:var(--tinta-2)}
.vacio .ico{width:40px;height:40px;color:var(--agua)}
.opcion-entrega{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}
.opcion-entrega label{border:1.5px solid var(--borde);border-radius:12px;padding:.7rem;cursor:pointer;display:flex;gap:.5rem;align-items:center;font-weight:600}
.opcion-entrega label.on{border-color:var(--agua);background:var(--agua-claro)}
.caja{background:var(--elevado);border-radius:12px;padding:.8rem 1rem;margin:.8rem 0}
.aviso{background:var(--agua-claro);border-radius:12px;padding:.7rem .9rem;font-size:.9rem;margin:.8rem 0}
.aviso.err{background:rgba(232,84,63,.12);color:var(--coral)}
.ok-ico{width:56px;height:56px;border-radius:50%;background:var(--agua-claro);color:var(--agua-osc);display:grid;place-items:center;margin:0 auto 1rem}
.ok-ico .ico{width:30px;height:30px}
.alias{display:flex;gap:.5rem;align-items:center;justify-content:space-between;background:var(--elevado);border-radius:12px;padding:.7rem 1rem;font-weight:700;word-break:break-all}

/* Cuenta / contacto */
.panel{background:var(--superficie);border:1px solid var(--borde);border-radius:16px;padding:1.1rem;margin-bottom:1rem}
.panel h2{font-size:1.25rem;margin-bottom:.8rem}
.ped{border:1px solid var(--borde);border-radius:14px;padding:.9rem;margin-bottom:.7rem;background:var(--superficie)}
.ped-top{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;align-items:center}
.est{display:inline-block;padding:.15rem .65rem;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--elevado)}
.est.pendiente{background:#FFF0C7;color:#6b4b00}
.est.pagado,.est.entregado{background:var(--agua-claro);color:var(--agua-osc)}
.est.preparacion,.est.enviado{background:#DCE8FF;color:#1f3f8a}
.est.cancelado{background:rgba(232,84,63,.14);color:var(--coral)}
html[data-tema="noche"] .est.pendiente{background:#4a3b0a;color:#ffe08a}
html[data-tema="noche"] .est.preparacion,html[data-tema="noche"] .est.enviado{background:#1c2f5c;color:#b9d0ff}
details{border-bottom:1px solid var(--borde);padding:.8rem 0}
summary{cursor:pointer;font-weight:700}
details p{margin-top:.5rem;color:var(--tinta-2)}
.foot{margin-top:3rem;border-top:1px solid var(--borde);padding:1.6rem 0 2.4rem;color:var(--suave);font-size:.9rem}
.foot-in{display:flex;flex-wrap:wrap;gap:.8rem 1.5rem;justify-content:space-between;align-items:center}
.foot a{text-decoration:none;font-weight:600}

/* Toasts y diálogos */
#toasts{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:400;display:grid;gap:.5rem;width:min(92vw,420px);pointer-events:none}
.toast{padding:.75rem 1rem;border-radius:12px;background:var(--tinta);color:var(--fondo);font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.error{background:var(--coral);color:#fff}
.toast.success{background:var(--agua-osc);color:#fff}
html[data-tema="noche"] .toast.success{color:#062126;background:var(--agua)}
dialog{border:0;border-radius:20px;padding:0;width:min(600px,94vw);max-height:92vh;background:var(--superficie);color:var(--tinta);overflow:auto}
dialog::backdrop{background:var(--velo)}
.dlg-in{padding:1.3rem}
.dlg-in h2{margin-bottom:1rem}
.dlg-btns{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}

/* Panel de administración */
.adm{padding-bottom:3rem}
.adm-top{display:flex;align-items:center;gap:.5rem;padding:.9rem 0;flex-wrap:wrap}
.adm-top strong{font-family:'Fraunces',Georgia,serif;font-size:1.25rem}
.adm-tabs{display:flex;gap:.4rem;overflow-x:auto;padding:.3rem 0 .8rem;border-bottom:1px solid var(--borde);margin-bottom:1.2rem;scrollbar-width:none}
.adm-tabs a{padding:.5rem .95rem;border-radius:999px;text-decoration:none;white-space:nowrap;color:var(--tinta-2);font-weight:700}
.adm-tabs a.on{background:var(--btn-fondo);color:var(--btn-texto)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin-bottom:1.2rem}
@media(min-width:720px){.stats{grid-template-columns:repeat(5,1fr)}}
.stat{background:var(--superficie);border:1px solid var(--borde);border-radius:14px;padding:.9rem}
.stat span{font-size:.82rem;color:var(--suave);font-weight:600}
.stat b{display:block;font-family:'Fraunces',Georgia,serif;font-size:1.5rem;margin-top:.2rem}
.stat.alerta b{color:var(--coral)}
.fila-p{display:grid;grid-template-columns:56px 1fr;gap:.4rem .8rem;align-items:center;padding:.8rem;border:1px solid var(--borde);border-radius:14px;background:var(--superficie);margin-bottom:.6rem}
.fila-p .th{width:56px;height:56px;border-radius:10px;background:var(--elevado);overflow:hidden;grid-row:span 2}
.fila-p .th img{width:100%;height:100%;object-fit:contain}
.fila-p .acc{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

<script>
(() => {
'use strict';

/* ======================================================================
   AROMA PROPIO — tienda de perfumes en un solo archivo.
   Sin servidor: todo se guarda en este navegador (localStorage).
   Si existe un datos.json junto a este archivo, la tienda lo usa como catálogo.
   ====================================================================== */

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => '$' + (Number(n) || 0).toLocaleString('es-AR');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const ico = (n, cls = '') => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const miles = el => { const d = el.value.replace(/\D/g, ''); el.value = d ? Number(d).toLocaleString('es-AR') : ''; };
const nMiles = el => Number(String(el.value || '').replace(/\D/g, '')) || 0;

const LS = {
  get(k, d) { try { const v = localStorage.getItem('ap_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ap_' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem('ap_' + k); } catch (e) {} }
};
const SS = {
  get(k) { try { return sessionStorage.getItem('ap_' + k); } catch (e) { return null; } },
  set(k, v) { try { sessionStorage.setItem('ap_' + k, v); } catch (e) {} },
  del(k) { try { sessionStorage.removeItem('ap_' + k); } catch (e) {} }
};

function toast(msg, tipo = 'info') {
  const t = document.createElement('div');
  t.className = 'toast ' + tipo;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), tipo === 'error' ? 4500 : 2600);
}

function confirmar(titulo, texto, boton = 'Aceptar') {
  return new Promise(res => {
    const d = $('#dlg-conf');
    $('#conf-titulo').textContent = titulo;
    $('#conf-texto').textContent = texto || '';
    $('#conf-si').textContent = boton;
    const fin = v => { d.close(); $('#conf-si').onclick = null; $('#conf-no').onclick = null; d.onclose = null; res(v); };
    $('#conf-si').onclick = () => fin(true);
    $('#conf-no').onclick = () => fin(false);
    d.onclose = () => res(false);
    d.showModal();
  });
}

function descargar(nombre, obj) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function comprimir(file, max = 900, q = 0.72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('No se pudo leer la imagen'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('El archivo no es una imagen válida'));
      im.onload = () => {
        const s = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.width * s));
        c.height = Math.max(1, Math.round(im.height * s));
        const x = c.getContext('2d');
        x.fillStyle = '#fff';
        x.fillRect(0, 0, c.width, c.height);
        x.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function normalizarWA(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (!d) return '';
  d = d.replace(/^00/, '');
  if (d.startsWith('54')) d = d.slice(2);
  d = d.replace(/^0+/, '');
  if (d.startsWith('9') && d.length === 11) d = d.slice(1);
  if (d.length > 10) {
    const m = d.match(/^(\d{2,4})15(\d{6,8})$/);
    if (m && (m[1] + m[2]).length === 10) d = m[1] + m[2];
  }
  return d.length === 10 ? '549' + d : d;
}
const linkWA = (num, msg) => `https://wa.me/${num || ''}?text=${encodeURIComponent(msg || '')}`;

/* ---------- datos por defecto ---------- */
const PROVINCIAS = ['Ciudad Autónoma de Buenos Aires', 'Buenos Aires', 'Catamarca', 'Chaco', 'Chubut', 'Córdoba', 'Corrientes', 'Entre Ríos', 'Formosa', 'Jujuy', 'La Pampa', 'La Rioja', 'Mendoza', 'Misiones', 'Neuquén', 'Río Negro', 'Salta', 'San Juan', 'San Luis', 'Santa Cruz', 'Santa Fe', 'Santiago del Estero', 'Tierra del Fuego', 'Tucumán'];
const ESTADOS = { pendiente: 'Pendiente', pagado: 'Pagado', preparacion: 'En preparación', enviado: 'Enviado', entregado: 'Entregado', cancelado: 'Cancelado' };
const CONC = ['Extrait de parfum', 'Eau de parfum', 'Eau de toilette', 'Eau de cologne', 'Body mist'];

function seedEnvios() {
  const z1 = 'z1', z2 = 'z2', z3 = 'z3', z4 = 'z4';
  const m = {};
  ['Ciudad Autónoma de Buenos Aires', 'Buenos Aires'].forEach(p => m[p] = z1);
  ['Córdoba', 'Santa Fe', 'Entre Ríos', 'La Pampa', 'San Luis', 'Mendoza'].forEach(p => m[p] = z2);
  ['Catamarca', 'Chaco', 'Corrientes', 'Formosa', 'Jujuy', 'La Rioja', 'Misiones', 'Salta', 'San Juan', 'Santiago del Estero', 'Tucumán'].forEach(p => m[p] = z3);
  ['Chubut', 'Neuquén', 'Río Negro', 'Santa Cruz', 'Tierra del Fuego'].forEach(p => m[p] = z4);
  return {
    adicional: 2000,
    zonas: [{ id: z1, nombre: 'CABA y GBA', precio: 6000 }, { id: z2, nombre: 'Centro', precio: 8000 }, { id: z3, nombre: 'Norte', precio: 10000 }, { id: z4, nombre: 'Patagonia', precio: 13000 }],
    provincias: m
  };
}

function seed() {
  const dia = n => new Date(Date.now() - n * 864e5).toISOString();
  const P = (n, id, nombre, categoria, marca, precio, stock, ml, concentracion, notas, descripcion, extra = {}) => ({
    id, nombre, categoria, marca, precio, stock, ml, concentracion, notas, descripcion,
    enOferta: false, porcentajeDescuento: 0, activo: true, precioTransferencia: true,
    imagenes: [], vendida: 0, fecha: dia(n), ...extra
  });
  return {
    categorias: [{ id: 'c1', nombre: 'Mujer' }, { id: 'c2', nombre: 'Hombre' }, { id: 'c3', nombre: 'Unisex' }],
    productos: [
      P(1, 'p1', 'Brisa Marina', 'Unisex', 'Casa Brisa', 32000, 8, 100, 'Eau de parfum', 'sal marina, bergamota, ámbar gris', 'Fresco y limpio, con salitre y cítricos. Sale bien todos los días del año.', { vendida: 14 }),
      P(2, 'p2', 'Cítrico Nº 1', 'Hombre', 'Verde Norte', 27500, 12, 100, 'Eau de toilette', 'limón, pomelo, vetiver', 'Arranca con mucha chispa cítrica y termina en un fondo verde y seco.', { enOferta: true, porcentajeDescuento: 15, vendida: 9 }),
      P(3, 'p3', 'Jazmín Blanco', 'Mujer', 'Atelier Sal', 38900, 5, 50, 'Eau de parfum', 'jazmín, flor de naranjo, almizcle', 'Floral luminoso, suave sobre la piel y con buena estela.', { vendida: 6 }),
      P(4, 'p4', 'Madera Clara', 'Hombre', 'Verde Norte', 41500, 3, 100, 'Eau de parfum', 'cedro, cardamomo, haba tonka', 'Amaderado cálido con un toque especiado. Ideal para la noche.', { vendida: 11 }),
      P(5, 'p5', 'Té Verde y Pera', 'Mujer', 'Casa Brisa', 24900, 0, 100, 'Eau de cologne', 'té verde, pera, musgo blanco', 'Ligero y transparente, para los días de calor.', { vendida: 20 })
    ],
    config: {
      nombreTienda: 'Aroma Propio', bannerUrl: '', bannerTitulo: 'Encontrá el aroma que te represente',
      bannerSubtitulo: 'Envío gratis en compras desde $80.000', whatsappNumero: '', envioGratisDesde: 80000,
      aliasCbu: '', retiroLocal: false, emailContacto: '', direccionContacto: '', mapaUrl: ''
    },
    envios: seedEnvios()
  };
}

/* ---------- estado ---------- */
let D = null;
let VEND = LS.get('vendidos', {});
let PEDIDOS = LS.get('pedidos', []);
let CARRITO = LS.get('carrito', []);
let FAVS = LS.get('favs', []);
let CUENTAS = LS.get('cuentas', []);
let SESION = LS.get('sesion', null);
let authTab = 'login';
let abrirCOtrasRuta = false;
let fallosLogin = 0, bloqueoLogin = 0;
const usuario = () => CUENTAS.find(c => c.id === SESION) || null;
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
let vista = LS.get('vista', 'compacta');
const filtro = { q: '', cat: 'todas', orden: 'nuevos' };

function normalizarDatos(x) {
  const s = seed();
  return {
    categorias: Array.isArray(x.categorias) ? x.categorias : s.categorias,
    productos: x.productos,
    config: { ...s.config, ...(x.config || {}) },
    envios: { ...s.envios, ...(x.envios || {}) }
  };
}
/* Quita datos de ejemplo de versiones anteriores que el navegador pudo haber guardado. */
function limpiarViejos() {
  const n = D.productos.length + D.categorias.length;
  D.productos = D.productos.filter(p => p.id !== 'p6');
  D.categorias = D.categorias.filter(c => c.id !== 'c4');
  if (VEND.p6 !== undefined) { delete VEND.p6; LS.set('vendidos', VEND); }
  if (n !== D.productos.length + D.categorias.length) guardar();
}
async function cargarDatos() {
  const local = LS.get('datos', null);
  if (local && Array.isArray(local.productos)) { D = normalizarDatos(local); limpiarViejos(); return; }
  try {
    const r = await fetch('datos.json', { cache: 'no-cache' });
    if (r.ok) { const j = await r.json(); if (j && Array.isArray(j.productos)) { D = normalizarDatos(j); return; } }
  } catch (e) {}
  D = seed();
}
const guardar = () => LS.set('datos', D);

/* ---------- productos ---------- */
const prod = id => D.productos.find(p => p.id === id);
const stockDe = p => Math.max(0, (Number(p.stock) || 0) - (VEND[p.id] || 0));
const ventas = p => (Number(p.vendida) || 0) + (VEND[p.id] || 0);
const enOferta = p => !!p.enOferta && Number(p.porcentajeDescuento) > 0;
const precioFinal = p => enOferta(p) ? Math.round(p.precio * (1 - p.porcentajeDescuento / 100)) : p.precio;
const disponible = p => p.activo && stockDe(p) > 0;
const presentacion = p => [p.ml ? p.ml + ' ml' : '', p.concentracion].filter(Boolean).join(', ');

function hash(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function botella(p) {
  const [a, b] = PALETAS[hash(p.id || p.nombre || 'x') % PALETAS.length];
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect x="80" y="14" width="40" height="26" rx="6" fill="#0E3B43"/><rect x="93" y="40" width="14" height="14" fill="#9CC9C6"/><rect x="40" y="54" width="120" height="170" rx="24" fill="url(#g)"/><rect x="40" y="54" width="120" height="170" rx="24" fill="none" stroke="#0E3B43" stroke-opacity=".3" stroke-width="2"/><rect x="56" y="72" width="12" height="110" rx="6" fill="#fff" opacity=".4"/><rect x="74" y="122" width="60" height="42" rx="6" fill="#fff" opacity=".85"/></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
const imgDe = (p, i = 0) => (p.imagenes && p.imagenes[i]) || botella(p);
const imgTag = (p, i = 0) => `<img src="${esc(imgDe(p, i))}" data-fb="${esc(botella(p))}" alt="${esc(p.nombre)}" loading="lazy" referrerpolicy="no-referrer">`;

/* ---------- carrito ---------- */
function depurarCarro() {
  let cambio = false;
  CARRITO = CARRITO.filter(i => {
    const p = prod(i.id);
    if (!p || !p.activo || stockDe(p) <= 0) { cambio = true; return false; }
    if (i.cant > stockDe(p)) { i.cant = stockDe(p); cambio = true; }
    return i.cant > 0;
  });
  if (cambio) LS.set('carrito', CARRITO);
}
const lineas = () => { depurarCarro(); return CARRITO.map(i => { const p = prod(i.id); return { p, cant: i.cant, precio: precioFinal(p) }; }); };
const subtotal = () => lineas().reduce((a, l) => a + l.precio * l.cant, 0);
const articulos = () => CARRITO.reduce((a, i) => a + i.cant, 0);
function guardarCarro() { LS.set('carrito', CARRITO); pintarBadges(); }

function agregar(id, cant = 1) {
  const p = prod(id);
  if (!p || !p.activo) { toast('Este perfume ya no está disponible', 'error'); return false; }
  const disp = stockDe(p);
  if (disp <= 0) { toast('Este perfume no tiene stock', 'error'); return false; }
  const it = CARRITO.find(i => i.id === id);
  const actual = it ? it.cant : 0;
  if (actual >= disp) { toast('Ya tenés todas las unidades disponibles en el carrito', 'error'); return false; }
  const suma = Math.min(cant, disp - actual);
  if (it) it.cant += suma; else CARRITO.push({ id, cant: suma });
  if (suma < cant) toast(`Solo quedan ${disp} unidades`, 'error');
  guardarCarro();
  renderCarro();
  return true;
}
function cambiarCant(id, d) {
  const it = CARRITO.find(i => i.id === id); if (!it) return;
  const p = prod(id);
  const n = it.cant + d;
  if (n <= 0) CARRITO = CARRITO.filter(i => i.id !== id);
  else if (p && n > stockDe(p)) { toast(`Solo quedan ${stockDe(p)} unidades`, 'error'); return; }
  else it.cant = n;
  guardarCarro(); renderCarro();
}

function pintarBadges() {
  const n = articulos(), f = FAVS.filter(id => prod(id)).length;
  const bc = $('#bdg-carro'), bf = $('#bdg-fav');

  bf.textContent = f; bf.hidden = f === 0;

function calcEnvio(prov, arts, sub) {
  if (!prov) return { ok: false, costo: 0, motivo: 'Elegí tu provincia para calcular el envío.' };
  const z = D.envios.zonas.find(x => x.id === D.envios.provincias[prov]);
  if (!z) return { ok: false, costo: 0, motivo: 'No hay tarifa cargada para tu zona. Consultanos por WhatsApp.' };
  const min = Number(D.config.envioGratisDesde) || 0;
  if (min > 0 && sub >= min) return { ok: true, costo: 0, gratis: true, zona: z };
  const costo = Number(z.precio) + Math.max(0, arts - 1) * (Number(D.envios.adicional) || 0);
  return { ok: true, costo, gratis: false, zona: z };
}

function confirmarPedido() {
  const u = usuario();
  if (!u) { abrirCheckout(); return; }
  const ls = lineas();
  if (!ls.length) { cerrar('#co'); return; }
  for (const l of ls) if (stockDe(l.p) < l.cant) { toast(`${l.p.nombre}: quedan ${stockDe(l.p)}`, 'error'); renderCarro(); return; }
  const retiro = esRetiro(), sub = subtotal();
  const cli = {
    nombre: $('#c-nombre').value.trim(), telefono: $('#c-tel').value.trim(),
    direccion: retiro ? '' : $('#c-dir').value.trim(), entreCalles: retiro ? '' : $('#c-entre').value.trim(),
    ciudad: retiro ? '' : $('#c-ciudad').value.trim(), provincia: retiro ? '' : $('#c-prov').value,
    codigoPostal: retiro ? '' : $('#c-cp').value.trim()
  };
  let env = { ok: true, costo: 0, zona: { nombre: 'Retiro en el local' } };
  if (!retiro) { env = calcEnvio(cli.provincia, articulos(), sub); if (!env.ok) { toast(env.motivo, 'error'); return; } }
  const pedido = {
    id: uid(), numero: numeroPedido(), fecha: new Date().toISOString(), clienteId: u.id, clienteEmail: u.email, cliente: cli, notas: $('#c-notas').value.trim(),
    items: ls.map(l => ({ id: l.p.id, nombre: nombreLargo(l.p), precio: l.precio, cant: l.cant })),
    subtotal: sub, envio: env.costo, zona: env.zona.nombre, total: sub + env.costo,
    estado: 'pendiente', esRetiro: retiro, stockDevuelto: false
  };
  pedido.mensajeWhatsapp = armarMensaje(pedido);
  ls.forEach(l => { VEND[l.p.id] = (VEND[l.p.id] || 0) + l.cant; });
  LS.set('vendidos', VEND);
  PEDIDOS.unshift(pedido); LS.set('pedidos', PEDIDOS);
  Object.assign(u, Object.fromEntries(Object.entries(cli).filter(([k, v]) => v))); LS.set('cuentas', CUENTAS);
  CARRITO = []; guardarCarro(); renderCarro();
  $('#co-titulo').textContent = 'Pedido registrado';
  $('#co-body').innerHTML = `<div class="cent">
    <div class="ok-ico">${ico('check')}</div>
    <h2>Pedido ${esc(pedido.numero)}</h2>
    <p class="suave" style="margin:.6rem 0 1rem">${retiro ? 'Tocá el botón para enviarnos tu pedido por WhatsApp junto con el comprobante. Ahí coordinamos el día y horario para que pases a retirarlo.' : 'Tocá el botón para enviarnos tu pedido por WhatsApp junto con el comprobante de la transferencia.'}</p>

    ${D.config.whatsappNumero ? '' : '<p class="ayuda" style="margin-top:.5rem">Todavía no hay un número de WhatsApp cargado: al abrir WhatsApp vas a tener que elegir el contacto.</p>'}

  </div>`;
  pintarVista();
}

function pintarChips() {
  const el = $('#chips'); if (!el) return;
  const chip = (v, t) => `<button type="button" class="chip ${filtro.cat === v ? 'on' : ''}" data-act="cat" data-cat="${esc(v)}" aria-pressed="${filtro.cat === v}">${esc(t)}</button>`;

}
function filtrar() {
  let l = D.productos.filter(p => p.activo);
  if (filtro.cat === 'ofertas') l = l.filter(enOferta);
  else if (filtro.cat !== 'todas') l = l.filter(p => p.categoria === filtro.cat);
  const q = norm(filtro.q).trim();
  if (q) l = l.filter(p => norm([p.nombre, p.marca, p.categoria, p.notas, p.concentracion].join(' ')).includes(q));
  const o = filtro.orden;
  l.sort((a, b) => o === 'precio-asc' ? precioFinal(a) - precioFinal(b)
    : o === 'precio-desc' ? precioFinal(b) - precioFinal(a)
    : o === 'vendidos' ? ventas(b) - ventas(a)
    : o === 'az' ? a.nombre.localeCompare(b.nombre, 'es')
    : new Date(b.fecha) - new Date(a.fecha));
  return [...l.filter(disponible), ...l.filter(p => !disponible(p))];

async function registrar() {
  const nombre = $('#r-nombre').value.trim(), email = $('#r-email').value.trim().toLowerCase(), tel = $('#r-tel').value.trim();
  const p1 = $('#r-pass').value, p2 = $('#r-pass2').value;
  if (!nombre) { toast('Escribí tu nombre', 'error'); return; }
  if (!emailOk(email)) { toast('Revisá el email: parece incompleto', 'error'); return; }
  if (p1.length < 6) { toast('La contraseña necesita al menos 6 caracteres', 'error'); return; }
  if (p1 !== p2) { toast('Las contraseñas no coinciden', 'error'); return; }
  if (CUENTAS.some(c => c.email === email)) { toast('Ya hay una cuenta con ese email. Ingresá con tu contraseña.', 'error'); return; }
  const salt = uid() + uid();
  const c = { id: uid(), email, salt, hash: await hashPass(p1, salt), nombre, telefono: tel, direccion: '', entreCalles: '', ciudad: '', codigoPostal: '', provincia: '', fecha: new Date().toISOString() };
  CUENTAS.push(c);
  if (!LS.set('cuentas', CUENTAS)) { CUENTAS.pop(); toast('No se pudo crear la cuenta: el almacenamiento del navegador está lleno', 'error'); return; }
  iniciarSesion(c.id, `¡Bienvenido/a, ${nombre.split(' ')[0]}!`);
}
async function ingresar() {
  if (Date.now() < bloqueoLogin) { toast('Demasiados intentos. Esperá unos segundos y probá de nuevo.', 'error'); return; }
  const email = $('#l-email').value.trim().toLowerCase(), c = CUENTAS.find(x => x.email === email);
  if (c && await hashPass($('#l-pass').value, c.salt) === c.hash) { fallosLogin = 0; iniciarSesion(c.id, 'Sesión iniciada'); return; }
  if (++fallosLogin >= 5) { bloqueoLogin = Date.now() + 30000; fallosLogin = 0; }
  toast('El email o la contraseña no son correctos', 'error');
  $('#l-pass').select();
}

async function hashPass(pw, salt) {
  const data = new TextEncoder().encode(salt + ':' + pw);
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  return 'x' + btoa(unescape(encodeURIComponent(salt + pw)));
}

function admProdLista() {
  const q = norm(adm.pq), f = adm.pf;

function guardarProducto() {
  const nombre = $('#pf-nombre').value.trim(), precio = nMiles($('#pf-precio'));
  if (!nombre) { toast('Poné un nombre', 'error'); return; }
  if (precio <= 0) { toast('El precio tiene que ser mayor a 0', 'error'); return; }
  const oferta = $('#pf-oferta').checked, pct = Number($('#pf-pct').value) || 0;
  if (oferta && (pct < 1 || pct > 90)) { toast('El descuento tiene que estar entre 1 y 90 %', 'error'); return; }
  let cat = $('#pf-cat').value;
  if (cat === '__nueva') {
    cat = $('#pf-cat-nueva').value.trim();
    if (cat) {
      const ya = D.categorias.find(c => norm(c.nombre) === norm(cat));
      if (ya) cat = ya.nombre; else D.categorias.push({ id: uid(), nombre: cat });
    }
  }
  const stockEf = Math.max(0, parseInt($('#pf-stock').value, 10) || 0);
  const base = {
    nombre, marca: $('#pf-marca').value.trim(), categoria: cat, ml: Number($('#pf-ml').value) || 0,
    concentracion: $('#pf-conc').value, notas: $('#pf-notas').value.trim(), descripcion: $('#pf-desc').value.trim(),
    precio, enOferta: oferta, porcentajeDescuento: oferta ? pct : 0, precioTransferencia: $('#pf-transf').checked,
    activo: $('#pf-activo').checked, imagenes: [...pfImgs]
  };
  if (pfEditId) {
    const p = prod(pfEditId); Object.assign(p, base); p.stock = stockEf + (VEND[p.id] || 0);
  } else {
    D.productos.unshift({ id: uid(), ...base, stock: stockEf, vendida: 0, fecha: new Date().toISOString() });
  }
  if (!guardar()) { toast('No se pudo guardar: el almacenamiento del navegador está lleno. Probá con menos fotos o con links de imagen.', 'error'); return; }
  $('#dlg').close(); toast('Perfume guardado', 'success'); pintarBadges(); admProductos();
}

function cambiarEstado(id, nuevo) {
  const p = PEDIDOS.find(x => x.id === id); if (!p) return false;
  const antes = p.estado; if (antes === nuevo) return true;
  if (nuevo === 'cancelado' && !p.stockDevuelto) {
    p.items.forEach(i => { VEND[i.id] = Math.max(0, (VEND[i.id] || 0) - i.cant); });
    p.stockDevuelto = true;
  } else if (antes === 'cancelado' && nuevo !== 'cancelado' && p.stockDevuelto) {
    for (const i of p.items) { const pr = prod(i.id); if (pr && stockDe(pr) < i.cant) { toast(`No hay stock suficiente de ${i.nombre} para reactivar el pedido`, 'error'); return false; } }
    p.items.forEach(i => { VEND[i.id] = (VEND[i.id] || 0) + i.cant; });
    p.stockDevuelto = false;
  }
  p.estado = nuevo;
  LS.set('vendidos', VEND); LS.set('pedidos', PEDIDOS); pintarBadges();
  return true;
}

const ruta = () => { const [a, b] = location.hash.replace(/^#\/?/, '').split('/'); return { a: a || '', b: b ? decodeURIComponent(b) : '' }; };

function pintarVista() {
  const r = ruta();
  document.body.classList.toggle('en-admin', r.a === 'admin');
  document.title = D.config.nombreTienda;
  if (r.a === 'producto') vistaProducto(r.b);
  else if (r.a === 'favoritos') vistaFavoritos();
  else if (r.a === 'cuenta') vistaCuenta();
  else if (r.a === 'contacto') vistaContacto();
  else if (r.a === 'admin') vistaAdmin(r.b);
  else vistaHome();
}
function router() {
  cerrarPaneles(); pintarVista(); window.scrollTo(0, 0);
  if (abrirCOtrasRuta) { abrirCOtrasRuta = false; abrirCheckout(); }
}

function aplicarMarca() {
  const n = D.config.nombreTienda || 'Aroma Propio';
  ['#logo', '#foot-nombre', '#menu-nombre', '#carga-nombre'].forEach(s => { const e = $(s); if (e) e.textContent = n; });
  document.title = n;
}
function aplicarTema(t) {
  document.documentElement.setAttribute('data-tema', t);
  const m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'noche' ? '#0A2429' : '#EEF7F6');
  $('#btn-tema').innerHTML = ico(t === 'noche' ? 'sol' : 'luna');
  LS.set('tema', t);
}
function toggleFav(id) {
  const i = FAVS.indexOf(id);
  if (i >= 0) FAVS.splice(i, 1); else FAVS.push(id);
  LS.set('favs', FAVS); pintarBadges();
  return i < 0;
}
async function copiarTexto(t) {
  try { await navigator.clipboard.writeText(t); toast('Copiado', 'success'); }
  catch (e) {
    const a = document.createElement('textarea'); a.value = t; a.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); toast('Copiado', 'success'); } catch (err) { toast('No se pudo copiar. Copialo a mano.', 'error'); }
    a.remove();
  }
}

/* ---------- clicks ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'menu': abrirMenu(); break;
    case 'tema': aplicarTema(document.documentElement.getAttribute('data-tema') === 'noche' ? 'claro' : 'noche'); break;
    case 'carro-abrir': abrirCarro(); break;
    case 'cerrar': cerrar(el.dataset.panel); break;
    case 'cerrar-todo': cerrarPaneles(); break;
    case 'cat':
      filtro.cat = el.dataset.cat; cerrarPaneles();
      if (ruta().a === '') { pintarChips(); pintarGrid(); $('#catalogo')?.scrollIntoView({ behavior: 'smooth' }); }
      else location.hash = '#/';
      break;
    case 'ir-catalogo': $('#catalogo')?.scrollIntoView({ behavior: 'smooth' }); break;
    case 'vista':
      vista = el.dataset.v; LS.set('vista', vista);
      $('#grid').dataset.vista = vista;
      $$('.vtog button').forEach(b => { const on = b.dataset.v === vista; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      break;
    case 'limpiar': filtro.q = ''; filtro.cat = 'todas'; vistaHome(); break;
    case 'fav': {
      const on = toggleFav(id);
      $$(`[data-act="fav"][data-id="${CSS.escape(id)}"]`).forEach(b => {
        b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
        if (b.classList.contains('fav-i')) b.style.color = on ? 'var(--coral)' : '';
      });
      if (ruta().a === 'favoritos') vistaFavoritos();
      break;
    }
    case 'abrir': location.hash = '#/producto/' + id; break;
    case 'add': if (agregar(id)) { toast('Agregado al carrito', 'success'); } break;
    case 'comprar': { const ok = agregar(id); if (ok || CARRITO.some(i => i.id === id)) abrirCheckout(); break; }
    case 'gal': { const p = prod(ruta().b); if (!p) break; $('#gal-main').innerHTML = imgTag(p, +el.dataset.i); $$('.gal-th button').forEach(b => b.classList.toggle('on', b === el)); break; }
    case 'pq': {
      const p = prod(ruta().b); if (!p) break;
      const v = $('#pq-v'); const n = Math.min(Math.max(1, stockDe(p)), Math.max(1, (+v.textContent || 1) + (+el.dataset.d)));
      v.textContent = n; break;
    }
    case 'pdp-add': if (agregar(id, +$('#pq-v').textContent || 1)) toast('Agregado al carrito', 'success'); break;
    case 'pdp-comprar': { const ok = agregar(id, +$('#pq-v').textContent || 1); if (ok || CARRITO.some(i => i.id === id)) abrirCheckout(); break; }
    case 'carro-mas': cambiarCant(id, 1); break;
    case 'carro-menos': cambiarCant(id, -1); break;
    case 'carro-quitar': CARRITO = CARRITO.filter(i => i.id !== id); guardarCarro(); renderCarro(); break;
    case 'carro-vaciar': if (await confirmar('¿Vaciar el carrito?', 'Se van a quitar todos los perfumes.', 'Vaciar')) { CARRITO = []; guardarCarro(); renderCarro(); } break;
    case 'checkout': abrirCheckout(); break;
    case 'copiar': copiarTexto(el.dataset.txt); break;
    case 'salir': cerrarSesion(); break;
    case 'auth-tab': authTab = el.dataset.t === 'registro' ? 'registro' : 'login'; vistaAuth(); break;
    case 'ped-cancelar': {
      const pd = PEDIDOS.find(p => p.id === id), u = usuario();
      if (!pd || !u || pd.clienteId !== u.id) break;
      if (await confirmar('¿Cancelar el pedido?', 'El stock de los perfumes vuelve a estar disponible.', 'Cancelar pedido')) { cambiarEstado(id, 'cancelado'); toast('Pedido cancelado', 'success'); vistaCuenta(); }
      break;
    }

    /* --- panel --- */
    case 'adm-salir': SS.del('ok'); vistaAdmin(); break;
    case 'p-nuevo': formProducto(); break;
    case 'p-editar': formProducto(id); break;
    case 'p-borrar': {
      const p = prod(id); if (!p) break;
      if (await confirmar('¿Eliminar este perfume?', `“${p.nombre}” se borra del catálogo. Esto no se puede deshacer.`, 'Eliminar')) {
        D.productos = D.productos.filter(x => x.id !== id); guardar(); pintarBadges(); admProdLista(); toast('Perfume eliminado', 'success');
      }
      break;
    }
    case 'stk': { const p = prod(id); if (!p) break; setStock(id, stockDe(p) + (+el.dataset.d)); admProdLista(); break; }
    case 'img-quitar': pfImgs.splice(+el.dataset.i, 1); renderPfImgs(); break;
    case 'img-url': {
      const u = $('#pf-url').value.trim();
      if (!/^https?:\/\//i.test(u)) { toast('Pegá un link que empiece con http', 'error'); break; }
      pfImgs.push(u); $('#pf-url').value = ''; renderPfImgs(); break;
    }
    case 'dlg-cerrar': $('#dlg').close(); break;
    case 'cat-mover': {
      const i = +el.dataset.i, j = i + (+el.dataset.d);
      if (j < 0 || j >= D.categorias.length) break;
      [D.categorias[i], D.categorias[j]] = [D.categorias[j], D.categorias[i]]; guardar(); admCategorias(); break;
    }
    case 'cat-borrar': {
      const c = D.categorias.find(x => x.id === id); if (!c) break;
      const n = D.productos.filter(p => p.categoria === c.nombre).length;
      if (await confirmar('¿Eliminar la categoría?', n ? `${n} ${n === 1 ? 'producto queda' : 'productos quedan'} sin categoría.` : 'Esta acción no se puede deshacer.', 'Eliminar')) {
        D.productos.forEach(p => { if (p.categoria === c.nombre) p.categoria = ''; });
        D.categorias = D.categorias.filter(x => x.id !== id);
        if (filtro.cat === c.nombre) filtro.cat = 'todas';
        guardar(); admCategorias();
      }
      break;
    }
    case 'ped-borrar':
      if (await confirmar('¿Eliminar el pedido?', 'Se borra el registro del pedido cancelado.', 'Eliminar')) { PEDIDOS = PEDIDOS.filter(p => p.id !== id); LS.set('pedidos', PEDIDOS); admPedidos(); }
      break;
    case 'zona-agregar': leerEnvios(); adm.env.zonas.push({ id: 'z' + uid(), nombre: 'Zona nueva', precio: 0 }); admEnvios(); break;
    case 'zona-borrar': {
      leerEnvios();
      const z = adm.env.zonas[+el.dataset.i]; if (!z) break;
      adm.env.zonas.splice(+el.dataset.i, 1);
      Object.keys(adm.env.provincias).forEach(k => { if (adm.env.provincias[k] === z.id) delete adm.env.provincias[k]; });
      admEnvios(); break;
    }
    case 'banner-quitar': $('#cfg-bimg').value = ''; $('#cfg-burl').value = ''; $('#cfg-prev').hidden = true; break;
    case 'dl-datos': descargar('datos.json', exportarCatalogo()); break;
    case 'dl-respaldo': descargar('aroma-propio-respaldo.json', { ...exportarCatalogo(), pedidos: PEDIDOS }); break;
    case 'borrar-pedidos':
      if (await confirmar('¿Borrar todos los pedidos?', 'Se borra el historial de este navegador. El stock no cambia.', 'Borrar')) { PEDIDOS = []; LS.set('pedidos', PEDIDOS); toast('Pedidos borrados', 'success'); }
      break;
    case 'reset-tienda':
      if (await confirmar('¿Volver a los datos de ejemplo?', 'Se pierden los productos, categorías, envíos y configuración de este navegador.', 'Restablecer')) {
        D = seed(); VEND = {}; CARRITO = []; FAVS = []; guardar(); LS.set('vendidos', VEND); LS.set('carrito', CARRITO); LS.set('favs', FAVS);
        adm.env = null; aplicarMarca(); pintarBadges(); renderCarro(); toast('Datos de ejemplo restaurados', 'success'); admDatos();
      }
      break;
  }
});

/* ---------- inputs ---------- */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { filtro.q = t.value; pintarGrid(); }
  else if (t.id === 'adm-q') { adm.pq = t.value; admProdLista(); }
  else if (t.hasAttribute && t.hasAttribute('data-miles')) miles(t);
  else if (t.id === 'cfg-wa') $('#cfg-wa-prev').textContent = normalizarWA(t.value) || '—';
  else if (t.id === 'cfg-burl') {
    const u = t.value.trim();
    $('#cfg-bimg').value = /^https?:\/\//i.test(u) ? u : '';
    const pr = $('#cfg-prev'); if ($('#cfg-bimg').value) { pr.src = u; pr.hidden = false; } else pr.hidden = true;
  }
});

document.addEventListener('change', async e => {
  const t = e.target, d = t.dataset || {};
  if (t.id === 'orden') { filtro.orden = t.value; pintarGrid(); }
  else if (t.id === 'adm-f') { adm.pf = t.value; admProdLista(); }
  else if (t.id === 'adm-ped-f') { adm.ped = t.value; admPedidos(); }
  else if (d.stk) { setStock(d.stk, t.value); admProdLista(); }
  else if (d.activo) { const p = prod(d.activo); if (p) { p.activo = t.checked; guardar(); admProdLista(); } }
  else if (d.pedEst) { if (!cambiarEstado(d.pedEst, t.value)) admPedidos(); }
  else if (d.catn) {
    const c = D.categorias.find(x => x.id === d.catn), n = t.value.trim();
    if (!c) return;
    if (!n) { t.value = c.nombre; return; }
    D.productos.forEach(p => { if (p.categoria === c.nombre) p.categoria = n; });
    if (filtro.cat === c.nombre) filtro.cat = n;
    c.nombre = n; guardar(); toast('Categoría renombrada', 'success');
  }
  else if (d.verpass !== undefined) $$('[data-pw]', t.closest('form')).forEach(i => { i.type = t.checked ? 'text' : 'password'; });
  else if (t.id === 'c-prov') totalesCheckout();
  else if (t.name === 'modo') aplicarModo();
  else if (t.id === 'pf-cat') $('#pf-cat-nueva-w').hidden = t.value !== '__nueva';
  else if (t.id === 'pf-oferta') $('#pf-pct-w').hidden = !t.checked;
  else if (t.id === 'pf-file') {
    for (const f of [...t.files]) {
      if (pfImgs.length >= 6) { toast('Máximo 6 fotos por perfume', 'error'); break; }
      try { pfImgs.push(await comprimir(f)); } catch (err) { toast(err.message, 'error'); }
    }
    t.value = ''; renderPfImgs();
  }
  else if (t.id === 'cfg-bfile' && t.files[0]) {
    try {
      const u = await comprimir(t.files[0], 1400, 0.75);
      $('#cfg-bimg').value = u; $('#cfg-burl').value = ''; const pr = $('#cfg-prev'); pr.src = u; pr.hidden = false;
    } catch (err) { toast(err.message, 'error'); }
    t.value = '';
  }
  else if (t.id === 'imp-file' && t.files[0]) { await importarArchivo(t.files[0]); t.value = ''; }
});

/* ---------- formularios ---------- */
document.addEventListener('submit', async e => {
  e.preventDefault();
  switch (e.target.id) {
    case 'form-co': confirmarPedido(); break;
    case 'form-login': await ingresar(); break;
    case 'form-registro': await registrar(); break;
    case 'form-cuenta': {
      const u = usuario(); if (!u) break;
      Object.assign(u, { nombre: $('#u-nombre').value.trim() || u.nombre, telefono: $('#u-tel').value.trim(), direccion: $('#u-dir').value.trim(), entreCalles: $('#u-entre').value.trim(), ciudad: $('#u-ciudad').value.trim(), codigoPostal: $('#u-cp').value.trim(), provincia: $('#u-prov').value });
      LS.set('cuentas', CUENTAS); toast('Datos guardados', 'success'); break;
    }
    case 'form-pass-cli': {
      const u = usuario(); if (!u) break;
      if (await hashPass($('#cp-actual').value, u.salt) !== u.hash) { toast('La contraseña actual no es correcta', 'error'); break; }
      const nueva = $('#cp-nueva').value;
      if (nueva.length < 6) { toast('La contraseña nueva necesita al menos 6 caracteres', 'error'); break; }
      u.salt = uid() + uid(); u.hash = await hashPass(nueva, u.salt); LS.set('cuentas', CUENTAS);
      e.target.reset(); toast('Contraseña actualizada', 'success'); break;
    }
    case 'form-adm-crear': {
      const a = $('#a-pass').value, b = $('#a-pass2').value;
      if (a.length < 6) { toast('La contraseña necesita al menos 6 caracteres', 'error'); break; }
      if (a !== b) { toast('Las contraseñas no coinciden', 'error'); break; }
      const salt = uid() + uid();
      LS.set('admin', { salt, hash: await hashPass(a, salt) }); SS.set('ok', '1'); vistaAdmin(); break;
    }
    case 'form-adm-login': {
      const c = LS.get('admin', null); if (!c) { vistaAdmin(); break; }
      if (await hashPass($('#a-pass').value, c.salt) === c.hash) { SS.set('ok', '1'); vistaAdmin(); }
      else { toast('Contraseña incorrecta', 'error'); $('#a-pass').select(); }
      break;
    }
    case 'form-pass': {
      const salt = uid() + uid(); LS.set('admin', { salt, hash: await hashPass($('#np').value, salt) });
      $('#np').value = ''; toast('Contraseña actualizada', 'success'); break;
    }
    case 'form-prod': guardarProducto(); break;
    case 'form-cat': {
      const n = $('#cat-nueva').value.trim(); if (!n) break;
      if (D.categorias.some(c => norm(c.nombre) === norm(n))) { toast('Esa categoría ya existe', 'error'); break; }
      D.categorias.push({ id: uid(), nombre: n }); guardar(); admCategorias(); break;
    }
    case 'form-envios':
      leerEnvios(); D.envios = JSON.parse(JSON.stringify(adm.env));
      if (guardar()) toast('Envíos guardados', 'success'); else toast('No se pudo guardar', 'error');
      adm.env = null; admEnvios(); break;
    case 'form-config': {
      const mapa = $('#cfg-mapa').value.trim();
      D.config = {
        ...D.config, nombreTienda: $('#cfg-nombre').value.trim() || 'Aroma Propio', bannerTitulo: $('#cfg-bt').value.trim(), bannerSubtitulo: $('#cfg-bs').value.trim(),
        bannerUrl: $('#cfg-bimg').value, whatsappNumero: normalizarWA($('#cfg-wa').value), envioGratisDesde: nMiles($('#cfg-eg')), aliasCbu: $('#cfg-alias').value.trim(),
        retiroLocal: $('#cfg-retiro').checked, emailContacto: $('#cfg-mail').value.trim(), direccionContacto: $('#cfg-dir').value.trim(),
        mapaUrl: /^https?:\/\//i.test(mapa) ? mapa : ''
      };
      if (!guardar()) { toast('No se pudo guardar: el almacenamiento del navegador está lleno. Probá con una foto más chica o un link.', 'error'); break; }
      aplicarMarca(); toast('Configuración guardada', 'success'); admConfig(); break;
    }
  }
});

/* ---------- varios ---------- */
document.addEventListener('error', e => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.dataset.fb) { const f = t.dataset.fb; delete t.dataset.fb; t.src = f; }
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarPaneles(); });
$('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ---------- arranque ---------- */
async function init() {
  const t0 = performance.now();
  try {
    await cargarDatos();
    aplicarTema(LS.get('tema', 'claro') === 'noche' ? 'noche' : 'claro');
    $('#anio').textContent = new Date().getFullYear();
    aplicarMarca(); pintarBadges(); renderCarro();
    window.addEventListener('hashchange', router);
    pintarVista();
  } catch (err) {
    console.error(err);
    $('#vista').innerHTML = '<div class="cont"><div class="vacio"><p>No se pudo cargar la tienda. Recargá la página.</p></div></div>';
  }
  /* La prepágina espera a que termine de cargar todo (fuentes e imágenes) y se muestra al menos 1,6 s. */
  const cargada = document.readyState === 'complete' ? Promise.resolve() : new Promise(r => window.addEventListener('load', r, { once: true }));
  await Promise.race([cargada, new Promise(r => setTimeout(r, 6000))]);
  setTimeout(() => { const c = $('#carga'); if (c) { c.classList.add('fuera'); setTimeout(() => c.remove(), 600); } }, Math.max(0, 1600 - (performance.now() - t0)));
}
init();
})();
</script>
</body>
